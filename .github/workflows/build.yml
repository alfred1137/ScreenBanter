name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Increase Pagefile (Avoid OOM)
        shell: pwsh
        run: |
          # Disable automatic page file management
          $ComputerSystem = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -CimInstance $ComputerSystem -Property @{AutomaticManagedPagefile = $False}

          # Create or Update Pagefile to 12GB
          $PagefilePath = "C:\pagefile.sys"
          $SizeInMB = 12288 # 12GB
          
          $CurrentPagefile = Get-CimInstance Win32_PageFileSetting | Where-Object { $_.Name -eq $PagefilePath }
          if ($null -eq $CurrentPagefile) {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name=$PagefilePath; InitialSize=$SizeInMB; MaximumSize=$SizeInMB}
          } else {
              Set-CimInstance -CimInstance $CurrentPagefile -Property @{InitialSize=$SizeInMB; MaximumSize=$SizeInMB}
          }

          Write-Host "Pagefile settings configured to 12GB."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync

      - name: Build Executable
        run: uv run python build_release.py

      - name: Create Release Zip
        shell: pwsh
        run: |
          # Robust version extraction from pyproject.toml
          $Version = (Select-String -Path pyproject.toml -Pattern 'version = "(.*)"').Matches.Groups[1].Value
          $FolderName = "ScreenBanter_v$Version"
          
          Write-Host "Zipping dist/$FolderName..."
          Compress-Archive -Path "dist/$FolderName" -DestinationPath "${FolderName}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_${{ github.ref_name }}
          path: "*.zip"
          retention-days: 5
