name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Build Executable
        run: uv run python build_release.py

      - name: Create Release Zip
        shell: pwsh
        run: |
          # Robust version extraction from pyproject.toml
          $Version = (Select-String -Path pyproject.toml -Pattern 'version = "(.*)"').Matches.Groups[1].Value
          $FolderName = "ScreenBanter_v$Version"
          
          Write-Host "Zipping dist/$FolderName..."
          Compress-Archive -Path "dist/$FolderName" -DestinationPath "${FolderName}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_${{ github.ref_name }}
          path: "*.zip"
          retention-days: 5