name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build Lite Version
        run: |
          uv sync
          uv run python build_release.py --lite

      - name: Build Full Version
        run: |
          uv sync --extra local-tts
          uv run python build_release.py

      - name: Create Release Zips
        shell: pwsh
        run: |
          $Version = (Get-Content pyproject.toml | ConvertFrom-StringData).version # Simplified for example, might need better parsing
          # Better way to get version from pyproject.toml
          $Version = (Select-String -Path pyproject.toml -Pattern 'version = "(.*)"').Matches.Groups[1].Value
          
          Compress-Archive -Path dist/ScreenBanter_Lite_v$Version -DestinationPath ScreenBanter_Lite_v$Version.zip
          Compress-Archive -Path dist/ScreenBanter_Full_v$Version -DestinationPath ScreenBanter_Full_v$Version.zip

      - name: Upload Lite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_Lite_v0.1.0
          path: ScreenBanter_Lite_v*.zip

      - name: Upload Full Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_Full_v0.1.0
          path: ScreenBanter_Full_v*.zip
