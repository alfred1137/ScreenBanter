name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [lite, full]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Increase Pagefile (Avoid OOM)
        uses: alrededor/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies (Lite)
        if: matrix.build_type == 'lite'
        run: uv sync

      - name: Install Dependencies (Full)
        if: matrix.build_type == 'full'
        run: uv sync --extra local-tts

      - name: Build Executable (Lite)
        if: matrix.build_type == 'lite'
        run: uv run python build_release.py --lite

      - name: Build Executable (Full)
        if: matrix.build_type == 'full'
        run: uv run python build_release.py

      - name: Create Release Zip
        shell: pwsh
        run: |
          # Robust version extraction from pyproject.toml
          $Version = (Select-String -Path pyproject.toml -Pattern 'version = "(.*)"').Matches.Groups[1].Value
          $Type = "${{ matrix.build_type }}".SubString(0,1).ToUpper() + "${{ matrix.build_type }}".SubString(1).ToLower()
          $FolderName = "ScreenBanter_${Type}_v$Version"
          
          Write-Host "Zipping dist/$FolderName..."
          Compress-Archive -Path "dist/$FolderName" -DestinationPath "${FolderName}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_${{ matrix.build_type }}_v0.1.0
          path: "*.zip"
          retention-days: 5
