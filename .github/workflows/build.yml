name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync

      - name: Build Executable with Nuitka
        run: uv run python build_release.py

      - name: Create Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ScreenBanter_v1.0 -DestinationPath ScreenBanter_Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenBanter_Windows_Executable
          path: ScreenBanter_Windows.zip
          retention-days: 5
